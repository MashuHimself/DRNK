- name: Generate Android icons from assets/icon.png
  run: npx --yes @capacitor/assets generate --android

- name: Rename app and change app id
  run: |
    sed -i 's|<string name="app_name">.*</string>|<string name="app_name">DRNK Hellwin</string>|' android/app/src/main/res/values/strings.xml
    sed -i 's|<string name="title_activity_main">.*</string>|<string name="title_activity_main">DRNK Hellwin</string>|' android/app/src/main/res/values/strings.xml
    sed -i 's|applicationId "\(.*\)"|applicationId "\1.hellwin"|' android/app/build.gradle


name: Build Android APK

on:
  push:
    branches: [ "main", "wersja-2" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies & Build Web
        run: |
          npm install
          npm run build --if-present
          npx cap sync android

      - name: Build APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK file
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
