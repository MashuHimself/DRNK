name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [Hellwin]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Hellwin

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate Android icons from assets/icon.png
        run: npx --yes @capacitor/assets generate --android

      - name: Rename app and change app id
        run: |
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">DRNK Hellwin</string>|' android/app/src/main/res/values/strings.xml
          sed -i 's|<string name="title_activity_main">.*</string>|<string name="title_activity_main">DRNK Hellwin</string>|' android/app/src/main/res/values/strings.xml
          sed -i 's|applicationId "\(.*\)"|applicationId "\1.hellwin"|' android/app/build.gradle

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: android/app/build/outputs/apk/debug/*.apk
